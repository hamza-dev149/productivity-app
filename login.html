<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Focentra</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="icon" type="image/png" href="assests/icons/Glossy Orange Folded T Logo.png">
</head>
<body>
    <div class="header">
        <h1>Focentra</h1>

        <a href="register.html">Sign up</a>
    </div>
    <main class="container">
        <img class="logo" src="assests/icons/Glossy Orange Folded T Logo.png" alt="Focentra logo">
        <h1>Welcome back</h1>
        <p class="subtitle">Log in to continue to your dashboard.</p>

        <form>
            <label class="sr-only" for="login-email">Email address</label>
            <input id="login-email" class="email-f" type="email" name="email" placeholder="Email address" autocomplete="email" required>

            <label class="sr-only" for="login-password">Password</label>
            <input id="login-password" class="password-f" type="password" name="password" placeholder="Password" autocomplete="current-password" required>

            <button class="submit-b" type="submit">Login</button>
        </form>

        <div class="have-account">
            <p>Don't have an account? <a href="register.html">Sign Up</a></p>
        </div>
    </main>
</body>
</html>
