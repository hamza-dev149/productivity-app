<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="stylesheet" href="css/register.css">
    <link rel="icon" type="image/png" href="assests/icons/Glossy Orange Folded T Logo.png">
</head>
<body>
    <div class="header">
        <h1>Focentra</h1>

        <a href="login.html">login</a>
    </div>
    <div class="container">
        <h1>Sign Up</h1>
        <form>
            <input class="name-f" type="text" placeholder="username" required>
            <input class="email-f" type="email" placeholder="example@email.com" required>
            <input class="password-f" type="password" placeholder="Password" required>
            <button class="submit-b" type="submit">Sign Up</button>
            <button class="google-b" type="submit">Sign Up with Google <img src="assests/icons/google.png" alt="Google Logo"></button>
        </form>
        <div class="have-account">
            <p>Already have an account? <a href="login.html">Login</a></p>
        </div>
    </div>
</body>
</html>
